name: Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the latest version of uv
        id: setup-uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: "setup-uv-${{ matrix.os }}"

      - name: Install dependencies
        run: uv pip install ".[test,scanpy,bbknn]"

      - name: Run tests
        run: pytest -v --tb=short

  pyodide-smoke:
    name: Pyodide smoke test (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Pyodide
        run: npm install --prefix "$RUNNER_TEMP/pyodide" pyodide@314.0.7

      - name: Run the smoke test
        run: node tests/pyodide/smoke.mjs
        env:
          PYODIDE_JS: ${{ runner.temp }}/pyodide/node_modules/pyodide/pyodide.mjs

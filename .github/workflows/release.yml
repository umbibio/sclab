name: Update Stable Tag and Create Release

on:
  workflow_call:

jobs:
  update-stable:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed for tag operations and creating releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags

      - name: Get tag info
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # a patch on an older line after a newer release must not become Latest or move stable
          NEWEST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ "$TAG" = "$NEWEST" ]; then LATEST=true; else LATEST=false; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "Processing version tag: $TAG (newest release: $NEWEST, latest: $LATEST)"

      - name: Update stable tag
        if: steps.tag.outputs.latest == 'true'
        run: |
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Get the current commit of the new version tag
          VERSION_COMMIT=$(git rev-parse ${{ steps.tag.outputs.tag }})

          # Create/update stable tag
          echo "Moving stable tag to version ${{ steps.tag.outputs.tag }} (commit: $VERSION_COMMIT)"
          git tag -f stable $VERSION_COMMIT
          git push origin refs/tags/stable -f

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Create a release using the GitHub CLI
          gh release create ${{ steps.tag.outputs.tag }} \
            --title "Release ${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            --latest=${{ steps.tag.outputs.latest }}

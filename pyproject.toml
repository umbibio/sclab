[project]
name = "sclab"
version = "0.5.0.dev13"
description = "sclab"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Argenis Arriojas", email = "ArriojasMaldonado001@umb.edu" },
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "anndata",
    "anywidget",
    "igraph",
    "ipywidgets",
    "itables",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "requests",
    "scikit-learn",
    "scipy",
    "svgpathtools",
    "tqdm",
    "xlsxwriter",
]

[project.urls]
"Repository" = "https://github.com/umbibio/sclab.git"
"Documentation" = "https://sclab.readthedocs.io"
"Homepage" = "https://github.com/umbibio/sclab"
"Bug Tracker" = "https://github.com/umbibio/sclab/issues"
"Changelog" = "https://github.com/umbibio/sclab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
bbknn = ["bbknn>=1.6.0"]
de = ["pylimma>=0.2.0"]
de-edger = ["edgepython>=0.5.1"]
doublets = ["doubletdetection>=4.3.0.post1", "scrublet>=0.2.3"]
jupyter = ["jupyterlab>=4.3.6"]
jscatter = ["jupyter-scatter"]
lazy = ["xarray", "dask"]
r = ["anndata2ri>=1.3", "rpy2>=3.5"]
scanpy = ["scanpy[leiden,skmisc]>=1.10"]
scdblfinder-py = ["igraph", "pyscdblfinder>=0.3.2"]
test = ["pytest>=8.3.4"]

[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "sclab"
source = "src/sclab"

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.3",
    "mkdocs-jupyter>=0.25.1",
    "mkdocstrings[python]>=1.0.3",
]
dev = [
    "bump-my-version>=0.31.1",
    "pre-commit>=4.1.0",
    "ruff>=0.9.4",
    "nox>=2024.1.29",
    "pytest>=8.3.4",
    "scanpy[harmony,leiden,scrublet,skmisc]>=1.10.4",
    "jupyterlab>=4.3.6",
    "scrublet>=0.2.3",
    "doubletdetection>=4.3.0.post1",
    "sclab[bbknn,de,de-edger,doublets,jupyter,r,scanpy]",
    "ripser>=0.6.12",
    "openpyxl>=3.1.5",
    { include-group = "docs" },
]
